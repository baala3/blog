<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a"/>
      <stop offset="100%" stop-color="#11142a"/>
    </linearGradient>
    <linearGradient id="accentBarT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrowT" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#a5b4fc"/>
    </marker>
  </defs>

  <rect width="500" height="500" fill="url(#bgT)"/>

  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
  </g>

  <ellipse cx="250" cy="120" rx="220" ry="140" fill="#6366f1" fill-opacity="0.10"/>
  <ellipse cx="80" cy="420" rx="160" ry="120" fill="#8b5cf6" fill-opacity="0.08"/>

  <rect x="0" y="0" width="500" height="4" fill="url(#accentBarT)"/>

  <!-- icon: shield with key + check, representing verified/tested passkey -->
  <g transform="translate(250,120)">
    <path d="M0,-58 L52,-38 L52,4 C52,42 26,66 0,78 C-26,66 -52,42 -52,4 L-52,-38 Z"
          fill="#161a34" stroke="#8b5cf6" stroke-width="2.5"/>
    <path d="M0,-58 L52,-38 L52,4 C52,42 26,66 0,78 Z"
          fill="#6366f1" fill-opacity="0.12"/>
    <!-- key -->
    <circle cx="-10" cy="-8" r="13" fill="none" stroke="#c7d2fe" stroke-width="4"/>
    <rect x="1" y="-11" width="30" height="6" fill="#c7d2fe"/>
    <rect x="21" y="-11" width="6" height="14" fill="#c7d2fe"/>
    <rect x="31" y="-11" width="6" height="10" fill="#c7d2fe"/>
    <!-- check badge -->
    <circle cx="24" cy="26" r="17" fill="#0d1024" stroke="#22d3ee" stroke-width="2.5"/>
    <path d="M16,26 L21,32 L33,18" fill="none" stroke="#67e8f9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- acronym -->
  <text x="250" y="248" font-family="monospace" font-size="44" font-weight="700" letter-spacing="5" fill="#f5f5fa" text-anchor="middle">CDP</text>

  <!-- divider -->
  <line x1="150" y1="270" x2="350" y2="270" stroke="#3730a3" stroke-width="1.5"/>

  <text x="250" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#9ca3af" text-anchor="middle">Virtual Authenticator Testing</text>

  <!-- tag pills -->
  <g font-family="monospace" font-size="11.5" font-weight="600">
    <rect x="88" y="316" width="96" height="24" rx="12" fill="#6366f1" fill-opacity="0.18" stroke="#6366f1" stroke-width="1"/>
    <text x="136" y="332" fill="#c7d2fe" text-anchor="middle">PASSKEYS</text>

    <rect x="192" y="316" width="108" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="1"/>
    <text x="246" y="332" fill="#ddd6fe" text-anchor="middle">WEBAUTHN</text>

    <rect x="308" y="316" width="104" height="24" rx="12" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1"/>
    <text x="360" y="332" fill="#a5f3fc" text-anchor="middle">PLAYWRIGHT</text>
  </g>

  <!-- mini flow -->
  <g>
    <rect x="70" y="392" width="100" height="52" rx="8" fill="#161a34" stroke="#4338ca" stroke-width="1.5"/>
    <text x="120" y="415" font-family="monospace" font-size="12" font-weight="700" fill="#c7d2fe" text-anchor="middle">Test</text>
    <text x="120" y="431" font-family="monospace" font-size="9.5" fill="#7c86a8" text-anchor="middle">Playwright</text>

    <rect x="200" y="392" width="100" height="52" rx="8" fill="#161a34" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="250" y="415" font-family="monospace" font-size="12" font-weight="700" fill="#ddd6fe" text-anchor="middle">CDP</text>
    <text x="250" y="431" font-family="monospace" font-size="9.5" fill="#7c86a8" text-anchor="middle">WebAuthn</text>

    <rect x="330" y="392" width="100" height="52" rx="8" fill="#161a34" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="380" y="415" font-family="monospace" font-size="12" font-weight="700" fill="#a5f3fc" text-anchor="middle">Browser</text>
    <text x="380" y="431" font-family="monospace" font-size="9.5" fill="#7c86a8" text-anchor="middle">sign-in</text>

    <line x1="170" y1="418" x2="196" y2="418" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#arrowT)"/>
    <line x1="300" y1="418" x2="326" y2="418" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#arrowT)"/>
  </g>
</svg>
