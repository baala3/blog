<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- floor line -->
  <path d="M 120,760 C 400,758 900,762 1480,759" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- crossed-out fingerprint, top-left -->
  <g stroke="#111111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 210,150 C 190,135 195,110 220,105 C 250,99 268,120 262,145 C 257,166 235,178 214,168"/>
    <path d="M 222,140 C 214,132 217,120 228,118 C 240,116 248,128 244,140 C 240,150 228,155 220,148"/>
    <path d="M 200,175 C 205,190 225,196 240,188"/>
  </g>
  <path d="M 178,98 L 288,196" stroke="#d1361c" stroke-width="4" stroke-linecap="round"/>
  <text x="150" y="230" font-family="'Segoe Print','Bradley Hand',cursive" font-size="26" fill="#d1361c" transform="rotate(-3 150 230)">no real finger</text>

  <!-- padlock, right side, shackle popped open -->
  <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- body -->
    <path d="M 980,470 C 1010,462 1200,463 1232,472 C 1246,520 1244,610 1230,660 C 1195,670 1015,669 984,659 C 970,610 968,518 980,470 Z"/>
    <!-- keyhole -->
    <circle cx="1106" cy="540" r="16"/>
    <path d="M 1106,554 L 1100,592 L 1112,592 Z"/>
    <!-- shackle: left prong fixed, right side swung open with a gap -->
    <path d="M 1015,470 C 1013,415 1020,375 1058,362 C 1085,353 1108,358 1112,378"/>
    <path d="M 1150,410 C 1168,392 1172,372 1160,358"/>
    <!-- pop motion lines -->
    <path d="M 1178,340 C 1188,332 1198,332 1204,338" opacity="0.6"/>
    <path d="M 1188,362 C 1198,358 1206,360 1210,368" opacity="0.5"/>
  </g>
  <text x="1250" y="430" font-family="'Segoe Print','Bradley Hand',cursive" font-size="26" fill="#d1361c" transform="rotate(4 1250 430)">pops open</text>
  <text x="1250" y="462" font-family="'Segoe Print','Bradley Hand',cursive" font-size="26" fill="#d1361c" transform="rotate(4 1250 462)">instantly</text>

  <!-- 小黑, lower-left, holding the stamp -->
  <g>
    <!-- body -->
    <path d="M 470,690 C 452,676 450,640 470,618 C 494,594 540,594 562,620 C 580,642 578,676 560,692 C 538,710 494,710 470,690 Z" fill="#111111" stroke="#111111" stroke-width="3"/>
    <!-- eyes -->
    <circle cx="500" cy="648" r="6" fill="#ffffff"/>
    <circle cx="532" cy="648" r="6" fill="#ffffff"/>
    <!-- legs -->
    <path d="M 496,706 C 494,724 492,742 490,758" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 534,706 C 536,724 538,742 540,758" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- arm reaching up to stamp handle -->
    <path d="M 556,636 C 590,612 620,588 646,566" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- stamp: handle + block, mid-air just above the keyhole -->
  <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 646,566 L 700,520"/>
    <path d="M 690,500 C 706,486 726,486 740,502 C 750,514 748,530 736,540 L 706,566 L 676,542 C 666,530 674,512 690,500 Z"/>
    <path d="M 676,542 L 656,606 C 690,622 748,620 780,604 L 758,538"/>
  </g>

  <!-- orange arrow: stamp action down to keyhole -->
  <path d="M 720,608 C 760,632 860,600 940,560" stroke="#c9711a" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
  <defs>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c9711a"/>
    </marker>
  </defs>
  <text x="700" y="670" font-family="'Segoe Print','Bradley Hand',cursive" font-size="26" fill="#c9711a" transform="rotate(-2 700 670)">stamp -&gt; approved</text>

  <!-- blue leader line + label near xiaohei -->
  <path d="M 430,660 C 400,650 380,636 366,618" stroke="#2f6fa8" stroke-width="2" fill="none" stroke-dasharray="2,6" stroke-linecap="round"/>
  <text x="270" y="614" font-family="'Segoe Print','Bradley Hand',cursive" font-size="26" fill="#2f6fa8">it's just code</text>
</svg>
